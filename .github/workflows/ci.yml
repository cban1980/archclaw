name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Presets are valid and produce routines
        run: |
          for f in config.example.yaml presets/sv.yaml; do
            ARCHNEST_CONFIG=$f node src/cli.ts check
            ARCHNEST_CONFIG=$f node src/cli.ts routines > /dev/null
          done
      - name: Installer parses
        run: bash -n bootstrap.sh
