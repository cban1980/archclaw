name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Example config is valid
        run: ARCHCLAW_CONFIG=config.example.yaml node src/cli.ts check
      - name: Installer parses
        run: bash -n bootstrap.sh
