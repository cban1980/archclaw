# archclaw config. `archclaw init` writes this to ~/.config/archclaw/config.yaml with your
# monitors and default apps. Claude can change most of it for you ("add Discord", "when I say
# focus mode, open the browser on the left and mute"), so you rarely need to edit it by hand.
# Hand edits apply as soon as you save; `archclaw check` validates.
name: my-pc                # this computer's name, as Claude and the sign-in page call it

# Notes Claude reads every time: who you are, your language, words you use, habits.
notes: |
  I usually talk to Claude by voice from my phone, so keep answers short.

# Friendly names for your monitors (`hyprctl monitors`), used by `screen:`.
screens:
  left: HDMI-A-1
  middle: DP-3
  right: HDMI-A-2

# Apps archclaw can open, close, move and play. `match` is a word in the window class or title.
# Apps Claude adds use `uwsm-app -- <id>.desktop` or `omarchy-launch-webapp '<url>'`; anything
# else (a custom command) can only be added here, by you.
apps:
  browser:                 # `archclaw init` fills in your default browser and terminal
    launch: omarchy-launch-browser
    match: chromium
  spotify:
    launch: omarchy-launch-spotify
    match: spotify
  terminal:
    launch: uwsm-app -- xdg-terminal-exec
    match: ghostty

# Your own terminal programs (name → command line). Claude can open these by name with
# open_terminal, besides installed TUIs like btop, nvim, lazygit and yazi, and ssh to hosts
# in ~/.ssh/config. Claude can't add or change these.
terminalPrograms:
  logs: journalctl --user -f

# Scenes: named setups Claude starts and stops when you say their name or an alias.
# Steps: a built-in action id (`archclaw list`), { open: app, screen: name, new: true },
# { close: app }, { play: app, screen: name }, { terminal: btop, dir: ~/Work, screen: left },
# { terminal: shell, ssh: myserver }, { omarchy: theme.set, value: Tokyo Night },
# or { run: "shell command" } (hand edits only).
# Without `stop`, nothing happens on stop. Power actions can't be in scenes.
scenes:
  - name: focus
    aliases: [focus mode, work]
    description: Browser on the left, terminal in the middle, do not disturb on
    start:
      - { open: browser, screen: left }
      - { open: terminal, screen: middle }
      - dnd.on
    stop:
      - dnd.off

  - name: done
    aliases: [i'm done with the computer, good night]
    description: Pause music, lock the computer and turn the screens off
    start:
      - media.pause
      - power.lock
      - display.off

# The Claude connector (a remote MCP server). `./bootstrap.sh` sets up a Cloudflare Tunnel
# and the address; or see README → Connect Claude.
connector:
  port: 8765                 # local only (127.0.0.1); the tunnel forwards to it
  # publicUrl: https://pc.example.com

# Spotify (optional, needs Premium): `archclaw spotify login` once. Claude can then play any
# track, album, artist or playlist here, and move playback from a speaker to this PC.
spotify:
  screen: right              # where Spotify opens if it isn't running
  # device: my-pc            # this PC's name in Spotify Connect (default: hostname)
  # handoffFrom: [Living Room speaker]   # handoff mode moves from these (default: speakers/TVs)

safety:
  countdownSeconds: 30       # shutdown/reboot/sleep/logout: a notification with Cancel first
  bootGraceSeconds: 120      # and never right after boot
