# Swedish preset: device names are what you say to Google, so they are in Swedish.
# Used by `archnest init --preset sv` (the bootstrap asks). Voice phrases: `phrases` below → `archnest routines`.
name: archnest            # the bridge itself in Google Home; keep it unlike any device name

# Put all archnest devices in this Google Home room (Home app → device → Room). A room of
# their own keeps "turn off the lights in the living room" away from the screens and volume.
room: Datorhörnan

matter:
  port: 5540
  # Change these before pairing; the defaults are well-known test values.
  passcode: 20202021
  discriminator: 3840

# Friendly names for your monitors (see `hyprctl monitors`), used by `screen:` below.
screens:
  left: HDMI-A-1
  middle: DP-3
  right: HDMI-A-2

# Apps archnest can open/close. `match` is checked against window class and title.
apps:
  browser:                 # `archnest init` fills in your default browser and terminal
    launch: omarchy-launch-browser
    match: chromium
  spotify:
    launch: omarchy-launch-spotify
    match: spotify
  terminal:
    launch: uwsm-app -- xdg-terminal-exec
    match: ghostty

# Claude connector: lets the Claude apps (phone, desktop, web) control this PC through
# archnest's tools. Off by default. `./bootstrap.sh` can set it up with Tailscale Funnel,
# or see README → Claude connector.
connector:
  enabled: false
  port: 8765                 # local only (127.0.0.1); the tunnel forwards to it
  # publicUrl: https://your-pc.your-tailnet.ts.net

# Spotify Connect (optional, needs Premium): `archnest spotify login` once.
# Music devices then take over playback from the Nest ("play X on Spotify" → this PC).
spotify:
  screen: right                # where Spotify opens if it isn't running
  # device: tor                # this PC's name in Spotify Connect (default: hostname)
  # handoffFrom: [Living Room speaker]   # default: any speaker/TV, never phones or computers

safety:
  countdownSeconds: 30     # risky actions show a notification with a Cancel button first
  bootGraceSeconds: 120    # ignore risky commands right after boot
  repeatWindowSeconds: 60  # from Google Home, risky commands must be given twice within this window

# Device types and how Gemini understands them (Swedish phrasing):
#   lock:      "lås datorn"                      runs `on`; remote unlocking is always refused
#   light:     "släck/tänd skärmarna"            on/off; "släck alla lampor" includes it
#   plug:      "slå av/på X"                     on/off
#   dimmer:    "sätt X till 30 procent"          on/off + level (`level` action gets the percent)
#   momentary: a button for routines             runs `on`, then flips back off
# Actions: built-in ids (`archnest list`), { run: "shell" }, { open: app, screen: name, new: true },
# { close: app }, or a list of these run in order (a scene).
# Power actions (shutdown/reboot/suspend/logout) are only allowed on momentary devices.
# `probe` is polled every 5 s (exit 0 = on/locked) so Google Home shows the real state.
devices:
  - name: Datorn
    type: lock
    on: power.lock
    probe: omarchy-hyprland-session-locked

  - name: Skärmarna
    type: light
    initial: true
    on: display.on
    off: display.off
    probe: "hyprctl monitors -j | jq -e 'length > 0 and all(.[]; .dpmsStatus)'"

  # Sound and music. "Datorns volym" is a dimmer: "sätt datorns volym till 30 procent".
  # Note: Google treats dimmers as lights, so "släck alla lampor" also mutes the PC.
  - name: Datorns volym
    type: dimmer
    initial: true
    on: volume.unmute
    off: volume.mute
    level: volume.set
    probe: "LC_ALL=C pactl get-sink-mute \"$(omarchy-audio-output-sink)\" | grep -q 'Mute: no'"
    levelProbe: "LC_ALL=C pactl get-sink-volume \"$(omarchy-audio-output-sink)\" | awk 'NR==1{for(i=1;i<=NF;i++) if($i ~ /%$/){sub(\"%\",\"\",$i); print $i; exit}}'"
    phrases:
      off: ["tysta datorn"]

  - name: Datormusiken
    type: plug                 # shows whether anything is playing (Spotify, browser, …)
    on: spotify.here
    off: media.pause
    probe: playerctl -a status 2>/dev/null | grep -qx Playing
    phrases:
      on: ["spela musiken på datorn", "flytta musiken till datorn"]
      off: ["pausa musiken på datorn"]

  - name: Musik till datorn
    type: plug                 # flyttar Spotify från Nest till datorn ("spela X på Spotify")
    on: spotify.handoff.on
    off: spotify.handoff.off
    probe: test -e "${ARCHNEST_STORAGE:-${XDG_STATE_HOME:-$HOME/.local/state}/archnest}/spotify-handoff"

  - name: Nästa låt på datorn
    type: momentary
    on: media.next
    phrases:
      on: ["nästa låt på datorn"]

  - name: Förra låten på datorn
    type: momentary
    on: media.previous
    phrases:
      on: ["förra låten på datorn"]

  # Desktop toggles; each one shows its real state in Google Home.
  - name: Stör ej
    type: plug
    on: dnd.on
    off: dnd.off
    probe: test "$(omarchy-shell notifications isDnd)" = on

  - name: Nattljus
    type: plug
    on: nightlight.on
    off: nightlight.off
    probe: omarchy-toggle-nightlight --status | jq -e .enabled >/dev/null

  - name: Håll datorn vaken
    type: plug
    on: awake.on
    off: awake.off
    probe: omarchy-toggle-idle status | jq -e .enabled >/dev/null

  # Apps. Plugs show in Google Home whether the app is running.
  - name: Spotify-appen
    type: plug
    on: { open: spotify, screen: right }
    off: { close: spotify }
    phrases:
      on: ["öppna spotify på datorn", "starta spotify på datorn"]
      off: ["stäng spotify på datorn"]

  - name: Webbläsaren
    type: momentary          # open only: closing the browser by voice could lose tabs
    on: { open: browser, screen: left }
    phrases:
      on: ["öppna webbläsaren", "öppna webbläsaren på datorn"]

  - name: Ny terminal
    type: momentary          # always a new window; never closes terminals (this one included)
    on: { open: terminal, screen: middle, new: true }
    phrases:
      on: ["öppna en terminal", "ny terminal på datorn"]

  # A scene: everything at once, each on its own screen.
  - name: Arbetsläge
    type: momentary
    on:
      - { open: browser, screen: left }
      - { open: terminal, screen: middle, new: true }
      - { open: spotify, screen: right }
    phrases:
      on: ["dags att jobba", "starta arbetsläge"]

  # Triggered by routines ("stäng av datorn", "starta om datorn", ...).
  - name: Avstängning
    type: momentary
    on: power.shutdown
    phrases:
      on: ["stäng av datorn", "stäng ner datorn", "datorn kan stängas av"]

  - name: Omstart
    type: momentary
    on: power.reboot
    phrases:
      on: ["starta om datorn", "omstart av datorn"]

  - name: Viloläge
    type: momentary
    on: power.suspend
    phrases:
      on: ["datorn ska sova", "sätt datorn i viloläge"]

  - name: Avbryt avstängning
    type: momentary
    on: power.cancel
    phrases:
      on: ["avbryt avstängningen", "avbryt omstarten", "stäng inte av datorn"]

# Fraser som styr flera enheter på en gång (kommer också med i `archnest routines`).
routines:
  - phrases: ["jag är klar med datorn"]
    actions:
      - Spotify-appen: false
      - Datorn: true              # lås
      - Skärmarna: false
